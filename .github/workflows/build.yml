name: Build Peso Ideal (Android & Windows)

on:
  workflow_dispatch: # Executa APENAS manualmente

jobs:
  # ==========================================
  # JOB 1: Android APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Android Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          unzip \
          zip \
          ccache
        python -m pip install --upgrade pip
        pip install --upgrade buildozer "cython==0.29.33"

    - name: Build with Buildozer Action
      uses: ArtemSydoryk/buildozer-action@v1.2.1
      with:
        command: buildozer android debug
        repository_root: .

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: peso-ideal-android-apk
        path: bin/*.apk

  # ==========================================
  # JOB 2: Windows EXE
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Windows Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build Windows Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed main.py

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: peso-ideal-windows-exe
        path: dist/main/
