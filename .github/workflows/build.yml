name: Build App Android e Windows

on:
  workflow_dispatch:

jobs:

  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-22.04

    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE20: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev

          pip install --upgrade pip
          pip install "buildozer>=1.5.0" cython

      - name: Compilar APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PesoIdeal-Android
          path: bin/*.apk

  build-windows:
    name: C*mpilar EXE Windows
    runs-on: wi*dows-latest

    steps:
      - us*s: actions/checkout@v4

      - na*e: Configurar Python
        uses:*actions/setup-python@v5
        wi*h:
          python-version: '3.11*

      - name: Instalar Dependenc*as
        run: |
          python*-m pip install --upgrade pip
     *    pip install pyinstaller kivy[base] kivy_deps.angle

          if *Test-Path requirements.txt) {
    *       pip install -r requirements*txt
          }

      - name: Ger*r Executavel
        env:
        * KIVY_GL_BACKEND: angle_sdl2
     *    KIVY_NO_ARGS: "1"
          KI*Y_HEADLESS: "1"
          KIVY_WIN*OW: mock
        run: |
          *yinstaller --noconfirm --onefile -*windowed --name "PesoIdeal" main.p*

      - name: Upload EXE
       *uses: actions/upload-artifact@v4
 *      with:
          name: PesoId*al-Windows
          path: dist/Pe*oIdeal.exe
