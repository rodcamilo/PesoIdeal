name: Build Peso Ideal (Android & Windows)

on:
  workflow_dispatch: # Executa APENAS manualmente quando você clicar em "Run workflow"

jobs:
  # ==========================================
  # JOB 1: Android APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Android Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          unzip \
          zip \
          ccache
        python -m pip install --upgrade pip
        pip install --upgrade buildozer "cython<3.0.0"

    - name: Accept Android SDK Licenses Automatically
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n24333f8a637b3702d1927e129f170b04c89dd1a5\n89330d3222e0e0f21508dae763172ef0132b84ba\nd56f518747945140b3297a73840788ee5a51a148" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9402116e05f350b8639fe287d758635489" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK
      run: |
        yes | buildozer android debug

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: peso-ideal-android-apk
        path: bin/*.apk

  # ==========================================
  # JOB 2: Windows EXE
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Windows Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build Windows Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed main.py

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: peso-ideal-windows-exe
        path: dist/main/
