name: Build Peso Ideal (Android & Windows)

on:
  workflow_dispatch: # Executa APENAS manualmente quando você clica em "Run workflow"

jobs:
  # ==========================================
  # JOB 1: Android APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build with Official Kivy Buildozer Action
      uses: kivy/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_root: .

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: peso-ideal-android-apk
        path: bin/*.apk

  # ==========================================
  # JOB 2: Windows EXE
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Windows Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build Windows Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed main.py

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: peso-ideal-windows-exe
        path: dist/main/
